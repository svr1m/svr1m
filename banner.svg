      <stop offset="1" stop-color="#a898ff"/>
    </linearGradient>
    <linearGradient id="lettering" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#caddff"/>
    </linearGradient>
    <radialGradient id="flare">
      <stop stop-color="#9ee5ff" stop-opacity=".58"/>
      <stop offset="1" stop-color="#9ee5ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .signal { stroke-dashoffset: var(--start); animation: circuit 14s linear infinite; }
      .pulse { animation: breathe 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes circuit { to { stroke-dashoffset: calc(var(--start) - 600); } }
      @keyframes breathe { 50% { opacity: .55; transform: scale(.82); } }
      @media (prefers-reduced-motion: reduce) { .signal, .pulse { animation: none; } }
    </style>
  </defs>

