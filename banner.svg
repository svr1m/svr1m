      <stop offset=".48" stop-color="#253879" stop-opacity=".30"/>
      <stop offset="1" stop-color="#141b43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridInk" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".38" stop-color="#a8bfff" stop-opacity="0"/>
      <stop offset=".81" stop-color="#a8bfff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#a8bfff" stop-opacity=".04"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
