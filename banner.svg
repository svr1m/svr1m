<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Sarim Zia - Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="220" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="220" fill="url(#bg)"/>

    <!-- soft animated waves -->
    <path fill="#ffffff" fill-opacity="0.06"
          d="M0 170 Q 125 130 250 170 T 500 170 T 750 170 T 1000 170 T 1250 170 T 1500 170 V 220 H 0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path fill="#ffffff" fill-opacity="0.10"
          d="M0 185 Q 125 155 250 185 T 500 185 T 750 185 T 1000 185 T 1250 185 T 1500 185 V 220 H 0 Z">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- name -->
    <text x="500" y="98" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="64" font-weight="700" fill="#ffffff">
      Sarim Zia
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>

    <!-- subtitle -->
    <text x="500" y="145" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="22" fill="#67e8f9" letter-spacing="2">
      FULL STACK DEVELOPER  |  AI &amp; ML ENTHUSIAST
      <animate attributeName="opacity" from="0" to="1" dur="1.8s" fill="freeze"/>
    </text>
  </g>
</svg>
